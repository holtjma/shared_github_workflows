# This workflow creates a release for a given tag, for projects that do not ship a binary (e.g. libraries).
# It uses the rust-static-test workflow to test the project and then creates a release with the changelog notes matching the version.
# This is the same as create-release, minus the binary build and the tarball attached to the release.
# Steps:
# - Extract the changelog section for the version
# - Call the rust-static-test workflow to run clippy, doc tests, and the static tests
# - Download the changelog artifact
# - Create the release with the changelog notes and no attached assets
# Errors:
# - If no changelog is found for the version, and fail_if_no_changelog is true, the workflow will fail
# - If the tests fail, the workflow will fail

name: Create Library Release

on:
  # in theory, workflow_dispatch could be here also; but we are trying to prevent accidental releases
  workflow_call:
    inputs:
      release_name:
        description: 'Release name'
        default: 'Release'
        type: string
      tag:
        description: 'Tag to update (e.g., v0.8.1)'
        required: true
        type: string
      rust_version:
        description: 'Rust Docker image version'
        default: 'latest'
        type: string
      test_docs:
        description: 'If true, test the docs'
        default: true
        type: boolean
      fail_if_no_changelog:
        description: 'Fail if no changelog is found for the version'
        default: true
        type: boolean

jobs:
  # Extract the changelog section for the version.
  # This expects a CHANGELOG.md file in the root of the repository.
  # The format of the CHANGELOG.md file is expected to be:
  # # v0.8.1
  # ## Changes
  # - New feature 1
  # - New feature 2
  # ## Fixed
  # - Bug fix 1
  extract-changelog:
    name: Extract changelog section
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Extract changelog section
      id: changelog
      run: |
        # Find the changelog section for this version
        if grep -q "^# ${{ inputs.tag }}$" CHANGELOG.md; then
          # Extract from the version header to the next version header or end of file
          awk '
            /^# ${{ inputs.tag }}$/ { 
              in_section = 1; 
              next 
            }
            /^# v[0-9]+\.[0-9]+\.[0-9]+$/ && in_section { 
              exit 
            }
            in_section { 
              print 
            }
          ' CHANGELOG.md > release_body.txt
        else
          if [[ "${{ inputs.fail_if_no_changelog }}" != "false" ]]; then
            echo "Failing because no changelog was found for version ${{ inputs.tag }}"
            exit 1
          else
            echo "No changelog found for version ${{ inputs.tag }}" > release_body.txt
          fi
        fi

        # Add a separator and boilerplate about the automation
        echo "" >> release_body.txt
        echo "---" >> release_body.txt
        echo "" >> release_body.txt
        echo "Automated release created from tag ${{ inputs.tag }} and commit ${{ github.sha }}" >> release_body.txt

    - name: Upload changelog artifact
      uses: actions/upload-artifact@v7
      with:
        name: release-changelog
        path: release_body.txt

  # Test the project; there is no binary to build here, so this replaces the rust-static-build call in create-release
  call-static-tests:
    name: Call rust-static-test workflow
    uses: ./.github/workflows/rust-static-test.yml # TODO: do we need to put a hash on this?
    with:
      rust_version: ${{ inputs.rust_version }}
      test_docs: ${{ inputs.test_docs }}

  # Check and create tag, which is required prior to creating the release
  create-tag:
    name: Check and create tag
    runs-on: ubuntu-latest
    needs: [call-static-tests, extract-changelog] # needs to run after the tests and changelog extraction have both succeeded
    steps:
    - name: Check if tag already exists
      uses: mukunku/tag-exists-action@v1.7.0
      id: check_tag
      with:
        tag: '${{ inputs.tag }}'

    - name: Create tag
      if: steps.check_tag.outputs.exists == 'false'
      uses: actions/github-script@v9
      with:
        script: |
          github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: 'refs/tags/${{ inputs.tag }}',
            sha: context.sha
          })

  # Create the release with the changelog notes; no assets are attached
  create-release:
    name: Create release
    needs: create-tag # needs to run after the tests, changelog extraction, and tag creation have all succeeded
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # Download the changelog artifact
    - name: Download changelog artifact
      uses: actions/download-artifact@v8
      with:
        name: release-changelog
        path: ./

    # Create the release with the changelog notes
    - name: Upload release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ inputs.release_name }} ${{ inputs.tag }}
        tag_name: ${{ inputs.tag }}
        body_path: release_body.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
